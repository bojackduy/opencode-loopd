name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install

      - name: Verify release version
        id: package
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Git tag $GITHUB_REF_NAME != package.json version $version"
            exit 1
          fi
          if npm view "$name@$version" version &>/dev/null; then
            echo "::error::$name@$version already published"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck & test
        run: bun run prepack

      - name: Lifecycle smoke (real OpenCode v2 host)
        env:
          LOOPD_SMOKE_HOST_VERSION: "2.0.32"
          LOOPD_SMOKE_ARTIFACTS_DIR: ${{ github.workspace }}/smoke-artifacts
        run: |
          set -euo pipefail
          # The host ships platform binaries as npm optional deps. Install the
          # exact version under test into a throwaway prefix, never the repo.
          host_dir="$RUNNER_TEMP/opencode-host"
          mkdir -p "$host_dir"
          npm install --prefix "$host_dir" --no-fund --no-audit "@opencode/cli@$LOOPD_SMOKE_HOST_VERSION"
          OPENCODE_V2_BIN="$host_dir/node_modules/.bin/opencode"
          "$OPENCODE_V2_BIN" --version
          OPENCODE_V2_BIN="$OPENCODE_V2_BIN" bun run smoke:v2-lifecycle

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-smoke
          path: smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract the CHANGELOG section for this version (between this ## and the next ##)
          version="${{ steps.package.outputs.version }}"
          # Grab lines from "## <version>" until the next "## " or end of file
          notes=$(awk -v ver="$version" '
            /^## / {
              if (found) exit
              if (index($0, "## " ver " ") == 1 || index($0, "## " ver "(") == 1) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$notes" ]; then
            notes="Published ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
